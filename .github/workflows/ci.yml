name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly dependency audit, so a CVE disclosed after merge still surfaces.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: mypy (strict)
        run: mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Manifest tests read git metadata; a shallow clone still provides HEAD,
          # but full history keeps `git describe`-style additions working later.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest
        # gpu and dataset markers are excluded: CI has neither a CUDA device nor any
        # licensed dataset, and a test that silently skips is worse than one that
        # never claimed to run.
        run: pytest -v -m "not gpu and not dataset" --cov=tayr --cov-report=term-missing

  # The `test` job installs `.[dev]` only, so everything that needs torch or rfdetr
  # skips there. This job is what makes those tests actually run. Its real purpose is
  # test_train_detector.py::TestUpstreamContract, which checks that every kwarg Tayr
  # sends to RF-DETR is still a field RF-DETR accepts - RF-DETR sets extra="forbid", so
  # a rename upstream would otherwise surface as a crash hours into a training run.
  cv-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # Several GB of wheels, so this is deliberately a separate job rather than a
      # dependency of every lint run.
      - run: pip install -e ".[cv,dev]"
      - name: Assert the extra actually installed
        # Without this, a resolution failure would turn every test below into a skip
        # and the job would pass while checking nothing.
        run: python -c "from tests.cv_extra import HAS_CV_EXTRA; assert HAS_CV_EXTRA, 'cv extra did not install'"
      - name: pytest (cv paths)
        run: |
          pytest -v -m "not gpu and not dataset" \
            tests/test_train_detector.py \
            tests/test_rfdetr_backend.py \
            tests/test_devices.py \
            tests/test_eval_harness.py \
            tests/test_cli.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pip-audit
        # --strict is incompatible with an editable install: it fails on any
        # distribution it cannot resolve, and `tayr` itself is not on PyPI. Rather
        # than lose the guarantee, we skip editables and then assert that `tayr` was
        # the ONLY thing skipped, so a genuine resolution failure still fails CI.
        run: |
          set -euo pipefail
          pip-audit --desc --skip-editable | tee /tmp/audit.txt
          skipped=$(awk '/Skip Reason/{flag=1;next} flag && NF {print $1}' /tmp/audit.txt \
                    | grep -v '^----' || true)
          if [ -n "$(echo "$skipped" | grep -v '^tayr$' | tr -d '[:space:]')" ]; then
            echo "::error::pip-audit skipped unexpected distributions:"
            echo "$skipped"
            exit 1
          fi
          echo "Only the local editable package was skipped, as expected."

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: build
        run: npm run build
      - name: audit
        run: npm audit --audit-level=high

  licence-guard:
    # Enforces the data-licence invariant mechanically. Drone-vs-Bird is distributed
    # under a data usage agreement granting no redistribution rights, so imagery and
    # weights must never enter git history. Intent is not a control; this is.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reject dataset imagery and model weights
        run: |
          set -euo pipefail
          pattern='\.(jpg|jpeg|png|tif|tiff|mp4|avi|mov|mkv|webm|pt|pth|onnx|engine|safetensors)$'
          if offenders=$(git ls-files | grep -Ei "$pattern"); then
            echo "::error::Dataset imagery or model weights found in the repository:"
            echo "$offenders"
            echo "These must never be committed. Use DVC or git-lfs with an external store."
            exit 1
          fi
          echo "No dataset imagery or model weights tracked in git."

      - name: every package source file is tracked
        # A .gitignore pattern like `datasets/` matches at any depth and would silently
        # exclude src/tayr/datasets/ from every commit. Nothing else in CI would notice:
        # the tests would still pass against the working tree. This catches it.
        run: |
          set -euo pipefail
          untracked=$(git ls-files --others --ignored --exclude-standard -- 'src/**/*.py' || true)
          if [ -n "$untracked" ]; then
            echo "::error::Package source files are being ignored by .gitignore:"
            echo "$untracked"
            exit 1
          fi
          echo "All src/**/*.py files are tracked."

      - name: reject committed .env files
        run: |
          set -euo pipefail
          if offenders=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'); then
            echo "::error::Real .env file committed:"
            echo "$offenders"
            exit 1
          fi
          echo "No .env files tracked in git."
